version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: project-zero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_zero_db
      POSTGRES_USER: forensic_admin
      POSTGRES_PASSWORD: zero_sec_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensic_admin -d project_zero_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Java 21 Forensics Core
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: project-zero-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: forensic_admin
      DB_PASSWORD: zero_sec_pass_2026
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_zero_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React TypeScript Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: project-zero-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  pgdata:
