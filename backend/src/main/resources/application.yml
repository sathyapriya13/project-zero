server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: project-zero-forensics
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/project_zero_db
    username: ${DB_USERNAME:forensic_admin}
    password: ${DB_PASSWORD:zero_sec_pass_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:projectzerodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

projectzero:
  forensics:
    storage-path: ./evidence-vault
    max-events-replay: 5000
    ai:
      gemini-api-key: ${GEMINI_API_KEY:}
      model-name: gemini-3.8-flash

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
